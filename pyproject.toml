[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotled-suite-common"
description = "Shared Python sender and protocol library for SpotLED Suite"
requires-python = ">=3.11"
dependencies = ["bleak>=0.21", "Pillow>=10.0"]
dynamic = ["version"]

[tool.setuptools]
packages = ["spotled_common"]

[tool.setuptools.dynamic]
version = {attr = "spotled_common.__version__"}
