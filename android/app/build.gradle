plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spotled.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.spotled.app'
        minSdk 26
        targetSdk 35
        versionCode 30
        versionName '0.19.6'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Internal sideloading only. Use the same local debug identity so
            // this APK can update the Pixel's installed prototype. Replace
            // with a securely managed release key before public distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
