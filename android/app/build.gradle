plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spotled.app'
    compileSdk 35

    sourceSets {
        main.assets.setSrcDirs(["$buildDir/generated/spotled-weather-assets"])
        test.resources.srcDir "$projectDir/../../test_fixtures"
        test.resources.srcDir "$projectDir/../../glyph_data"
        test.resources.srcDir "$projectDir/../../assets/weather-icons"
    }

    defaultConfig {
        applicationId 'com.spotled.app'
        minSdk 26
        targetSdk 35
        versionCode 33
        versionName '0.19.9'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Internal sideloading only. Use the same local debug identity so
            // this APK can update the Pixel's installed prototype. Replace
            // with a securely managed release key before public distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

def syncSpotledWeatherAssets = tasks.register('syncSpotledWeatherAssets', Copy) {
    from rootProject.file('../assets/weather-icons')
    into layout.buildDirectory.dir('generated/spotled-weather-assets/weather-icons')
    include '*.gif'
}

tasks.named('preBuild').configure { dependsOn syncSpotledWeatherAssets }

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
