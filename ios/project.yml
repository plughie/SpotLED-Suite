name: SpotLEDCompanion
options:
  bundleIdPrefix: net.bugmag
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  SpotLEDCompanion:
    type: application
    platform: iOS
    sources: [SpotLEDCompanion]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.bugmag.spotledcompanion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SPOTLED Companion
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: SpotLED Companion uses Bluetooth to find and send content to nearby SpotLED displays.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  SpotLEDCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SpotLEDCompanionTests]
    dependencies:
      - target: SpotLEDCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.bugmag.spotledcompanion.tests
        GENERATE_INFOPLIST_FILE: YES
